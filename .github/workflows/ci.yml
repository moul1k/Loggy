name: Test and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: loggy --version
      - name: Verify packaged browser assets
        working-directory: ${{ runner.temp }}
        run: python -c "from pathlib import Path; import loggy; p=Path(loggy.__file__).parent; assert all((p/f).is_file() for f in ['index.html','app.js','style.css','samples/01-baseline.json'])"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Loggy $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
